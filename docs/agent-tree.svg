<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
  <title id="title">Example hierarchy of agents and subagents</title>
  <desc id="desc">A root agent delegates to a supervisor. The supervisor may use a scout and owns two parallel work-package lanes. Each lane has an implementer followed by an independent verifier. Every agent card lists the Codex and Claude model and effort defaults.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 12" markerWidth="7" markerHeight="7" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 12 12" markerWidth="7" markerHeight="7" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 12 12" markerWidth="7" markerHeight="7" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .heading { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subheading { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .lane-title { font: 700 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .root-card { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .supervisor-card { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .scout-card { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .implementer-card { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .verifier-card { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .role { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .purpose { font: 500 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .runtime { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172033; }
      .ownership { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .ownership-line { fill: none; stroke: #2563eb; stroke-width: 2.5; }
      .sequence { fill: none; stroke: #7c3aed; stroke-width: 2.5; marker-end: url(#arrow-violet); }
      .optional { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-gray); }
      .edge-label { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .legend { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="canvas" width="900" height="610"/>
  <text class="heading" x="450" y="32" text-anchor="middle">Example delegated task tree</text>
  <text class="subheading" x="450" y="54" text-anchor="middle">Two independent work packages, the verifier gate fired, default routing shown for both runtimes</text>

  <rect class="root-card" x="266" y="72" width="368" height="84" rx="10"/>
  <text class="role" x="288" y="96">Root</text>
  <text class="purpose" x="288" y="114">Owns diagnosis, design decisions, review, and integration</text>
  <text class="runtime" x="288" y="133">Codex  · session model (gpt-5.6-sol) · session effort</text>
  <text class="runtime" x="288" y="148">Claude · opus · effort: high</text>

  <rect class="supervisor-card" x="266" y="196" width="368" height="84" rx="10"/>
  <text class="role" x="288" y="220">Supervisor</text>
  <text class="purpose" x="288" y="238">Owns WP coordination, diff review, evidence, and recovery</text>
  <text class="runtime" x="288" y="257">Codex  · gpt-5.6-sol · effort: low</text>
  <text class="runtime" x="288" y="272">Claude · opus · effort: medium</text>

  <rect class="scout-card" x="680" y="196" width="206" height="84" rx="10"/>
  <text class="role" x="700" y="220">Scout</text>
  <text class="purpose" x="700" y="238">Mechanical read-only search</text>
  <text class="runtime" x="700" y="257">Codex  · gpt-5.6-luna · low</text>
  <text class="runtime" x="700" y="272">Claude · haiku · n/a</text>

  <path class="ownership" d="M 450 156 L 450 194"/>
  <text class="edge-label" x="458" y="180">delegates</text>
  <path class="optional" d="M 634 238 L 676 238"/>
  <text class="edge-label" x="655" y="230" text-anchor="middle">optional</text>

  <rect class="lane" x="14" y="330" width="428" height="238" rx="12"/>
  <rect class="lane" x="458" y="330" width="428" height="238" rx="12"/>
  <text class="lane-title" x="228" y="354" text-anchor="middle">WP-1 · supervisor-owned lane</text>
  <text class="lane-title" x="672" y="354" text-anchor="middle">WP-2 · supervisor-owned lane</text>

  <path class="ownership-line" d="M 450 280 L 450 306 L 228 306"/>
  <path class="ownership" d="M 450 306 L 672 306 L 672 328"/>
  <path class="ownership" d="M 228 306 L 228 328"/>
  <text class="edge-label" x="450" y="298" text-anchor="middle">launch independent WPs concurrently</text>

  <rect class="implementer-card" x="34" y="366" width="388" height="84" rx="10"/>
  <text class="role" x="56" y="390">Implementer · WP-1</text>
  <text class="purpose" x="56" y="408">Owns production code and observable-behavior tests</text>
  <text class="runtime" x="56" y="427">Codex  · gpt-5.6-terra · effort: medium</text>
  <text class="runtime" x="56" y="442">Claude · sonnet · effort: medium</text>

  <rect class="verifier-card" x="34" y="470" width="388" height="84" rx="10"/>
  <text class="role" x="56" y="494">Verifier · WP-1</text>
  <text class="purpose" x="56" y="512">Fresh black-box pass against the success criteria</text>
  <text class="runtime" x="56" y="531">Codex  · gpt-5.6-terra · effort: high</text>
  <text class="runtime" x="56" y="546">Claude · sonnet · effort: high</text>

  <rect class="implementer-card" x="478" y="366" width="388" height="84" rx="10"/>
  <text class="role" x="500" y="390">Implementer · WP-2</text>
  <text class="purpose" x="500" y="408">Owns production code and observable-behavior tests</text>
  <text class="runtime" x="500" y="427">Codex  · gpt-5.6-terra · effort: medium</text>
  <text class="runtime" x="500" y="442">Claude · sonnet · effort: medium</text>

  <rect class="verifier-card" x="478" y="470" width="388" height="84" rx="10"/>
  <text class="role" x="500" y="494">Verifier · WP-2</text>
  <text class="purpose" x="500" y="512">Fresh black-box pass against the success criteria</text>
  <text class="runtime" x="500" y="531">Codex  · gpt-5.6-terra · effort: high</text>
  <text class="runtime" x="500" y="546">Claude · sonnet · effort: high</text>

  <path class="sequence" d="M 228 450 L 228 468"/>
  <path class="sequence" d="M 672 450 L 672 468"/>
  <text class="edge-label" x="238" y="464">artifact → independent check</text>
  <text class="edge-label" x="682" y="464">artifact → independent check</text>

  <line x1="180" y1="588" x2="212" y2="588" stroke="#2563eb" stroke-width="2.5"/>
  <text class="legend" x="220" y="592">ownership / spawn</text>
  <line x1="360" y1="588" x2="392" y2="588" stroke="#7c3aed" stroke-width="2.5"/>
  <text class="legend" x="400" y="592">ordered handoff</text>
  <line x1="520" y1="588" x2="552" y2="588" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="legend" x="560" y="592">optional child</text>
</svg>
