<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Example hierarchy of agents and subagents</title>
  <desc id="desc">A root agent delegates to a supervisor. The supervisor may use a scout and owns two parallel work-package lanes. Each lane has an implementer followed by an independent verifier. Every agent card lists exact Codex and Claude model and effort defaults.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .heading { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subheading { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .lane-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .root-card { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .supervisor-card { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.5; }
      .scout-card { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; }
      .implementer-card { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .verifier-card { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
      .role { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .purpose { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .runtime { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172033; }
      .runtime-small { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172033; }
      .ownership { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .ownership-line { fill: none; stroke: #2563eb; stroke-width: 4; }
      .sequence { fill: none; stroke: #7c3aed; stroke-width: 4; marker-end: url(#arrow-violet); }
      .optional { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow-gray); }
      .edge-label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .legend { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1000"/>
  <text class="heading" x="800" y="38" text-anchor="middle">Example delegated task tree</text>
  <text class="subheading" x="800" y="63" text-anchor="middle">Two independent work packages · verifier gate fired · exact default routing shown for both runtimes</text>

  <rect class="root-card" x="500" y="88" width="600" height="130" rx="14"/>
  <text class="role" x="525" y="119">Root</text>
  <text class="purpose" x="525" y="143">Owns diagnosis, design decisions, final review, and integration</text>
  <text class="runtime-small" x="525" y="175">Codex  · session model (expected gpt-5.6-sol) · effort: session-selected</text>
  <text class="runtime" x="525" y="202">Claude · opus · effort: high</text>

  <rect class="supervisor-card" x="500" y="278" width="600" height="130" rx="14"/>
  <text class="role" x="525" y="309">Supervisor</text>
  <text class="purpose" x="525" y="333">Owns WP coordination, diff review, evidence, and recovery</text>
  <text class="runtime" x="525" y="365">Codex  · gpt-5.6-sol · effort: low</text>
  <text class="runtime" x="525" y="392">Claude · opus · effort: medium</text>

  <rect class="scout-card" x="1170" y="278" width="360" height="130" rx="14"/>
  <text class="role" x="1194" y="309">Scout · optional</text>
  <text class="purpose" x="1194" y="333">Mechanical read-only search</text>
  <text class="runtime" x="1194" y="365">Codex  · gpt-5.6-luna · low</text>
  <text class="runtime" x="1194" y="392">Claude · haiku · effort: n/a</text>

  <path class="ownership" d="M 800 218 L 800 278"/>
  <text class="edge-label" x="816" y="252">delegates</text>
  <path class="optional" d="M 1100 343 L 1170 343"/>
  <text class="edge-label" x="1135" y="329" text-anchor="middle">optional</text>

  <rect class="lane" x="70" y="510" width="710" height="410" rx="16"/>
  <rect class="lane" x="820" y="510" width="710" height="410" rx="16"/>
  <text class="lane-title" x="425" y="544" text-anchor="middle">WP-1 · supervisor-owned parallel lane</text>
  <text class="lane-title" x="1175" y="544" text-anchor="middle">WP-2 · supervisor-owned parallel lane</text>

  <path class="ownership-line" d="M 800 408 L 800 470 L 425 470 L 425 570"/>
  <path class="ownership" d="M 800 470 L 1175 470 L 1175 570"/>
  <path class="ownership" d="M 425 470 L 425 570"/>
  <text class="edge-label" x="800" y="458" text-anchor="middle">launch independent WPs concurrently</text>

  <rect class="implementer-card" x="110" y="570" width="630" height="130" rx="14"/>
  <text class="role" x="135" y="601">Implementer · WP-1</text>
  <text class="purpose" x="135" y="625">Owns production code and focused observable-behavior tests</text>
  <text class="runtime" x="135" y="657">Codex  · gpt-5.6-terra · effort: medium</text>
  <text class="runtime" x="135" y="684">Claude · sonnet · effort: medium</text>

  <rect class="verifier-card" x="110" y="760" width="630" height="130" rx="14"/>
  <text class="role" x="135" y="791">Verifier · WP-1</text>
  <text class="purpose" x="135" y="815">Fresh black-box pass against observable success criteria</text>
  <text class="runtime" x="135" y="847">Codex  · gpt-5.6-terra · effort: high</text>
  <text class="runtime" x="135" y="874">Claude · sonnet · effort: high</text>

  <rect class="implementer-card" x="860" y="570" width="630" height="130" rx="14"/>
  <text class="role" x="885" y="601">Implementer · WP-2</text>
  <text class="purpose" x="885" y="625">Owns production code and focused observable-behavior tests</text>
  <text class="runtime" x="885" y="657">Codex  · gpt-5.6-terra · effort: medium</text>
  <text class="runtime" x="885" y="684">Claude · sonnet · effort: medium</text>

  <rect class="verifier-card" x="860" y="760" width="630" height="130" rx="14"/>
  <text class="role" x="885" y="791">Verifier · WP-2</text>
  <text class="purpose" x="885" y="815">Fresh black-box pass against observable success criteria</text>
  <text class="runtime" x="885" y="847">Codex  · gpt-5.6-terra · effort: high</text>
  <text class="runtime" x="885" y="874">Claude · sonnet · effort: high</text>

  <path class="sequence" d="M 425 700 L 425 760"/>
  <path class="sequence" d="M 1175 700 L 1175 760"/>
  <text class="edge-label" x="441" y="735">artifact → independent check</text>
  <text class="edge-label" x="1191" y="735">artifact → independent check</text>

  <line x1="320" y1="958" x2="365" y2="958" stroke="#2563eb" stroke-width="4"/>
  <text class="legend" x="375" y="963">ownership / spawn</text>
  <line x1="630" y1="958" x2="675" y2="958" stroke="#7c3aed" stroke-width="4"/>
  <text class="legend" x="685" y="963">ordered handoff</text>
  <line x1="930" y1="958" x2="975" y2="958" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
  <text class="legend" x="985" y="963">optional child</text>
</svg>
