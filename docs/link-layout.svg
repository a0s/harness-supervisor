<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-labelledby="title desc">
  <title id="title">Two consumer repositories linked to a shared supervisor harness</title>
  <desc id="desc">Project A and Project B appear as folder trees on either side of the harness-supervisor tree. Arrows connect each project's Codex and Claude supervisor skill directories and Claude agent files to their shared targets. State and settings remain local.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .shared-panel { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .panel-title { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tree { font: 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172033; }
      .tree-small { font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172033; }
      .note { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .skill-row { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; }
      .claude-row { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1; }
      .local-row { fill: #f1f5f9; stroke: #64748b; stroke-width: 1; stroke-dasharray: 4 4; }
      .skill-link { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .claude-link { fill: none; stroke: #7c3aed; stroke-width: 2.5; marker-end: url(#arrow-violet); }
      .link-label { font: 700 9.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="900" height="455"/>
  <text class="title" x="450" y="28" text-anchor="middle">Shared supervisor links</text>
  <text class="subtitle" x="450" y="50" text-anchor="middle">Arrows are symlinks, @ marks a linked entry, local state has no arrow</text>

  <rect class="panel" x="14" y="68" width="240" height="332" rx="10"/>
  <rect class="shared-panel" x="330" y="68" width="240" height="332" rx="10"/>
  <rect class="panel" x="646" y="68" width="240" height="332" rx="10"/>

  <text class="panel-title" x="134" y="94" text-anchor="middle">Project A</text>
  <text class="panel-title" x="450" y="94" text-anchor="middle">harness-supervisor</text>
  <text class="panel-title" x="766" y="94" text-anchor="middle">Project B</text>

  <rect class="skill-row" x="24" y="172" width="220" height="20" rx="4"/>
  <rect class="local-row" x="24" y="193" width="220" height="20" rx="4"/>
  <rect class="skill-row" x="24" y="235" width="220" height="20" rx="4"/>
  <rect class="claude-row" x="24" y="277" width="220" height="20" rx="4"/>
  <rect class="local-row" x="24" y="298" width="220" height="20" rx="4"/>

  <rect class="skill-row" x="340" y="172" width="220" height="20" rx="4"/>
  <rect class="claude-row" x="340" y="256" width="220" height="20" rx="4"/>

  <rect class="skill-row" x="656" y="172" width="220" height="20" rx="4"/>
  <rect class="local-row" x="656" y="193" width="220" height="20" rx="4"/>
  <rect class="skill-row" x="656" y="235" width="220" height="20" rx="4"/>
  <rect class="claude-row" x="656" y="277" width="220" height="20" rx="4"/>
  <rect class="local-row" x="656" y="298" width="220" height="20" rx="4"/>

  <text class="tree" x="30" y="124">
    <tspan x="30" dy="0">Proj-A/</tspan>
    <tspan x="30" dy="21">├── .agents/</tspan>
    <tspan x="30" dy="21">│   ├── skills/</tspan>
    <tspan x="30" dy="21">│   │   └── supervisor @</tspan>
    <tspan x="30" dy="21">│   └── state/  (local)</tspan>
    <tspan x="30" dy="21">└── .claude/</tspan>
    <tspan x="30" dy="21">    ├── skills/supervisor @</tspan>
    <tspan x="30" dy="21">    ├── agents/</tspan>
    <tspan x="30" dy="21">    │   └── supervisor-*.md @</tspan>
    <tspan x="30" dy="21">    └── settings.json (local)</tspan>
  </text>

  <text class="tree" x="346" y="124">
    <tspan x="346" dy="0">harness-supervisor/</tspan>
    <tspan x="346" dy="21">└── harness/</tspan>
    <tspan x="346" dy="21">    ├── .agents/</tspan>
    <tspan x="346" dy="21">    │   └── skills/supervisor/</tspan>
    <tspan x="346" dy="21">    │       ├── SKILL.md</tspan>
    <tspan x="346" dy="21">    │       └── reference/</tspan>
    <tspan x="346" dy="21">    └── .claude/</tspan>
    <tspan x="346" dy="21">        └── agents/</tspan>
  </text>
  <text class="tree-small" x="362" y="292">
    <tspan x="362" dy="0">├── supervisor-coordinator.md</tspan>
    <tspan x="362" dy="17">├── supervisor-coordinator-high.md</tspan>
    <tspan x="362" dy="17">├── supervisor-implementer.md</tspan>
    <tspan x="362" dy="17">├── supervisor-implementer-high.md</tspan>
    <tspan x="362" dy="17">├── supervisor-verifier.md</tspan>
    <tspan x="362" dy="17">└── supervisor-scout.md</tspan>
  </text>

  <text class="tree" x="662" y="124">
    <tspan x="662" dy="0">Proj-B/</tspan>
    <tspan x="662" dy="21">├── .agents/</tspan>
    <tspan x="662" dy="21">│   ├── skills/</tspan>
    <tspan x="662" dy="21">│   │   └── supervisor @</tspan>
    <tspan x="662" dy="21">│   └── state/  (local)</tspan>
    <tspan x="662" dy="21">└── .claude/</tspan>
    <tspan x="662" dy="21">    ├── skills/supervisor @</tspan>
    <tspan x="662" dy="21">    ├── agents/</tspan>
    <tspan x="662" dy="21">    │   └── supervisor-*.md @</tspan>
    <tspan x="662" dy="21">    └── settings.json (local)</tspan>
  </text>

  <path class="skill-link" d="M 254 182 L 322 182"/>
  <path class="skill-link" d="M 254 245 L 300 245 L 300 190 L 322 190"/>
  <path class="claude-link" d="M 254 287 L 300 287 L 300 268 L 322 268"/>
  <path class="skill-link" d="M 646 182 L 578 182"/>
  <path class="skill-link" d="M 646 245 L 600 245 L 600 190 L 578 190"/>
  <path class="claude-link" d="M 646 287 L 600 287 L 600 268 L 578 268"/>

  <text class="link-label" x="288" y="172" fill="#1d4ed8">directory</text>
  <text class="link-label" x="277" y="237" fill="#1d4ed8">Claude skill</text>
  <text class="link-label" x="277" y="279" fill="#6d28d9">6 files</text>
  <text class="link-label" x="612" y="172" fill="#1d4ed8">directory</text>
  <text class="link-label" x="623" y="237" fill="#1d4ed8">Claude skill</text>
  <text class="link-label" x="623" y="279" fill="#6d28d9">6 files</text>

  <text class="note" x="450" y="430" text-anchor="middle">Both skill entries share one directory, each Claude agent links by basename, and project state and settings stay local.</text>
</svg>
